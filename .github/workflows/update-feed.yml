name: Update feed

# 한글 요약 피드(feed.xml) 갱신. 매일 08/11/14/17시(KST) 하루 4번. 수동 실행 가능.
on:
  schedule:
    - cron: "5 23,2,5,8 * * *"   # UTC 23/02/05/08시 = KST 08/11/14/17시(5분 지연: 정각은 GitHub 스케줄이 몰려 더 늦어진다). 지연·누락될 수 있음
  workflow_dispatch:
    inputs:
      dry_run:
        description: "피드·items·seen을 바꾸지 않고 요약·번역 결과만 dry-run-items.json 아티팩트로 저장 (품질 비교용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: python scripts/test_fetch_and_summarize.py
      - name: Fetch feeds and summarize new items
        env:
          NEW_ITEMS_PATH: ${{ runner.temp }}/new_items.json
          MAX_NEW: ${{ inputs.dry_run && '30' || '20' }}
        run: python scripts/fetch_and_summarize.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Upload dry-run result
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-items
          path: dry-run-items.json
      - name: Validate feed.xml
        if: ${{ !inputs.dry_run }}
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('feed.xml')"
      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        env:
          NEW_ITEMS_PATH: ${{ runner.temp }}/new_items.json
        run: |
          git diff --quiet -- feed.xml items.json seen.json translations.json && { echo "변경 없음"; exit 0; }
          git config user.name "hahnjunhee"
          git config user.email "sgr.jhub@gmail.com"
          commit() {
            git add feed.xml items.json seen.json translations.json
            git commit -m "Feed update ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          }
          commit
          # 관리 화면이 feeds.txt·feed.xml·seen.json을 직접 커밋하므로 그 사이 main이 앞서 있을 수 있다.
          # rebase가 실패하면 origin/main 위에서 저장해 둔 요약(NEW_ITEMS_PATH)으로 add 를 다시 적용한다(번역 재호출 없음).
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "::warning::푸시 실패 ($i/3)"
            git rebase --abort 2>/dev/null || true
            [ "$i" -lt 3 ] || break
            sleep 3
            git fetch origin main
            git reset --hard origin/main
            [ -f "$NEW_ITEMS_PATH" ] || { echo "::error::$NEW_ITEMS_PATH 없음"; exit 1; }
            python scripts/update_feed.py add "$NEW_ITEMS_PATH"
            python -c "import xml.etree.ElementTree as ET; ET.parse('feed.xml')"
            git diff --quiet -- feed.xml items.json seen.json translations.json && { echo "변경 없음"; exit 0; }
            commit
          done
          exit 1
